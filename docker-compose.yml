version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: orderflow-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_USER=orderflow
      - DB_HOST=db
      - DB_NAME=orderflow
      - DB_PASSWORD=orderflow
      - DB_PORT=5432
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
